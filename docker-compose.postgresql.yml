# =============================================================================
#  Nexus Media All-in-One
#
#  对外只发布一个端口：${WEB_PORT:-8080} → 容器内 Nginx(8080)
#  后端 3000 不发布，通过 Nginx 反向代理到 8080
# =============================================================================

services:
  nexus-media:
    image: edwinhuish/nexus-media-allinone:latest
    container_name: nexus-media
    hostname: nexus-media
    restart: always

    # 唯一对外入口
    ports:
      - "${WEB_PORT:-8080}:8080"

    volumes:
      # 配置 / SQLite / 插件数据 / 日志
      - ./data:/data
      # 媒体库：改成你自己的目录
      - ${VIDEO_DIR:-/video}:/video

    environment:
      # 容器内进程身份 = 宿主机用户（id -u / id -g），保证文件权限一致
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      UMASK: ${UMASK:-000}
      TZ: ${TZ:-Asia/Shanghai}
      # Redis 与后端同网络，不需要对外映射端口
      REDIS__HOST: ${REDIS_HOST:-localhost}
      REDIS__PORT: ${REDIS_PORT:-6379}
      REDIS__DB: ${REDIS_DB:-0}
      # 需要外部数据库时取消注释（环境变量 > .env > config.yaml）
      DATABASE__TYPE: ${DB_TYPE:-postgresql} # sqlite | mysql | postgresql
      DATABASE__HOST: ${DB_HOST:-postgresql}
      DATABASE__PORT: ${DB_PORT:-5432}
      DATABASE__USERNAME: ${DB_USERNAME:-nexus_media}
      DATABASE__PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（禁止使用默认密码）}
      DATABASE__DATABASE: ${DB_DATABASE:-nexus_media}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - nexus-media-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: nexus-media-redis
    restart: always
    networks:
      - nexus-media-network
    volumes:
      - ./data/redis_data:/data
    command: redis-server --save "" --appendonly no --dir /data

  postgresql:
    image: postgres:17-alpine
    container_name: nexus-media-postgresql
    restart: always
    networks:
      - nexus-media-network
    environment:
      - POSTGRES_USER=${DB_USERNAME:-nexus_media}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（禁止使用默认密码）}
      - POSTGRES_DB=${DB_DATABASE:-nexus_media}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # OCR / 站点验证（可选）
  nexus-verify:
    image: linyuan0213/nexus-verify:latest
    container_name: nexus-verify
    restart: always
    networks:
      - nexus-media-network
    ports:
      - 9300:9300

  # Chrome 自动化（可选）
  nexus-chrome:
    image: linyuan0213/nexus-chrome:latest
    container_name: nexus-chrome
    restart: always
    networks:
      - nexus-media-network
    shm_size: 2g
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:?请在 .env 中设置 VNC_PASSWORD（禁止使用默认密码 password）}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - SESSION_TTL=1800
      - SESSION_CLEANUP_INTERVAL=60
      - DATA_DIR=/app/data
      - PROFILE_DATA_DIR=/app/data/profiles
      - USER_DATA_PATH=/app/data/user_data
      - FP_CENTER_DB=/app/data/fp_config_center.db
    volumes:
      - ./data/chrome:/app/data
    ports:
      - 9850:9850
      - 6080:6080

networks:
  nexus-media-network:
    driver: bridge
    name: nexus-media-network
