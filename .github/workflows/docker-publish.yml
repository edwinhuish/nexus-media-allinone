name: Build and Push Image

# 仅手动触发：Actions → 本工作流 → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: edwinhuish/nexus-media-allinone
  # 上游镜像仓库：版本号以 Docker Hub 上的最新版本 tag 为准
  BACKEND_REPO: linyuan0213/nexus-media
  FRONTEND_REPO: linyuan0213/nexus-media-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 解析上游版本 tag（Docker Hub）
        id: version
        run: |
          set -euo pipefail

          # 拉取指定 Docker Hub 仓库的全部 tag 名（自动翻页）
          fetch_tags() {
            local repo="$1" page=1 body names
            while :; do
              body="$(curl -fsSL --max-time 30 \
                "https://hub.docker.com/v2/repositories/${repo}/tags?page_size=100&page=${page}")" \
                || { echo "::error::无法访问 Docker Hub API：${repo}"; return 1; }
              names="$(printf '%s' "$body" | jq -r '.results[]?.name // empty')"
              [ -n "$names" ] && printf '%s\n' "$names"
              [ "$(printf '%s' "$body" | jq -r '.next')" = "null" ] && break
              page=$((page + 1))
            done
          }

          # 只保留 vX.Y.Z / X.Y.Z 形态（latest / latest-beta 等自动排除），按版本号取最大
          latest_version_tag() {
            fetch_tags "$1" \
              | { grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | awk '{ v = $0; sub(/^v/, "", v); print v "\t" $0 }' \
              | sort -s -k1,1V | tail -n1 | cut -f2
          }

          BACKEND_TAG="$(latest_version_tag "${BACKEND_REPO}")"
          FRONTEND_TAG="$(latest_version_tag "${FRONTEND_REPO}")"

          if [ -z "$BACKEND_TAG" ] || [ -z "$FRONTEND_TAG" ]; then
            echo "::error::未能解析到上游版本 tag（BACKEND_TAG='${BACKEND_TAG}' FRONTEND_TAG='${FRONTEND_TAG}'）"
            exit 1
          fi

          echo "上游最新版本：backend=${BACKEND_TAG} frontend=${FRONTEND_TAG}"
          echo "BACKEND_TAG=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_TAG=${FRONTEND_TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "BACKEND_TAG=${BACKEND_TAG}"
            echo "FRONTEND_TAG=${FRONTEND_TAG}"
          } >> "$GITHUB_ENV"

      - name: 配置 QEMU（用于多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BACKEND_TAG=${{ env.BACKEND_TAG }}
            FRONTEND_TAG=${{ env.FRONTEND_TAG }}
          # 除版本 tag 外，额外推送 latest 指向最新版本
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BACKEND_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
