name: Build and Push Image

# 仅手动触发。留空 version 时使用上游最新版本并同时打 latest；
# 指定 version 时只发布该版本号（不打 latest），且该版本已发布过则整次跳过。
#
# 版本解析与发布决策见 scripts/resolve-upstream-version.sh
#
# 注：Docker Hub 的仓库 Overview 不做自动同步。该接口要求令牌具备
# Read + Write + Delete 权限，仅 Read & Write 会返回 403 insufficient scope，
# 而本仓库不愿在 CI 中持有 delete 权限。需要更新 Overview 时，
# 请在 Docker Hub 仓库页面手动粘贴 README.md。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '指定上游版本号（如 4.22.1）；留空则使用上游最新版本'
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: edwinhuish/nexus-media-allinone
  BACKEND_REPO: linyuan0213/nexus-media
  FRONTEND_REPO: linyuan0213/nexus-media-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 解析版本 tag（Docker Hub）
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! report="$(./scripts/resolve-upstream-version.sh)"; then
            echo "::error::上游版本解析失败，详见本步骤日志"
            exit 1
          fi
          printf '%s\n' "$report"
          # 脚本 stdout 为 key=value：小写供 if 条件，大写供构建参数
          printf '%s\n' "$report" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$report" | tr '[:lower:]' '[:upper:]' >> "$GITHUB_ENV"

      - name: 配置 QEMU（用于多架构构建）
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BACKEND_TAG=${{ env.BACKEND_TAG }}
            FRONTEND_TAG=${{ env.FRONTEND_TAG }}
          # 指定版本时不打 latest：条件为假时该行求值为空，build-push-action 会忽略空行
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BACKEND_TAG }}
            ${{ steps.version.outputs.publish_latest == 'true' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
